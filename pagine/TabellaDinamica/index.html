<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Studenti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

    <h2 class="mb-4">Gestione Studenti</h2>

    <div class="row g-2 mb-4">
        <div class="col-md-3">
            <input type="text" id="nome" class="form-control" placeholder="Nome">
        </div>
        <div class="col-md-3">
            <input type="text" id="cognome" class="form-control" placeholder="Cognome">
        </div>
        <div class="col-md-2">
            <input type="number" id="eta" class="form-control" placeholder="Età">
        </div>
        <div class="col-md-2">
            <button onclick="aggiungiStudente()" class="btn btn-success w-100">Aggiungi</button>
        </div>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Età</th>
                <th>Azione</th>
            </tr>
        </thead>
        <tbody id="corpoTabella"></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
