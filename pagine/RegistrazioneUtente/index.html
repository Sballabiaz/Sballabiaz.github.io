        <section class="sezione">
            <h1>Registrazione Utente</h1>
            
            <div class="container-form">
                <label for="txt1">Nome: </label> 
                <input type="text" id="txt1">
                <br><br>
                
                <label for="txt2">Cognome: </label>

                <input type="text" id="txt3">
                <br><br>

                <input type="radio" id="maschio" name="sesso" value="maschio">
                <label for="maschio">Maschio</label>
                <input type="radio" id="femmina" name="sesso" value="femmina">

                <br><br>
                
                <select id="menu"></select>
                <br><br>
                
                <input type="checkbox" id="termini" class="termini&servizi" value="accettato"> 
                <label for="termini">Accetto termini e servizi</label>
                <br><br>
                
                <button onclick="StampaRegistrazione()" class="btn">REGISTRATI</button>
