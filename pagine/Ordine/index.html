    <!-- Nav bar principale del portfolio -->

    <section class="sezione">
        <h2>Esercizio Invio Di Un Ordine</h2>
        
        <table border="3px" style="border-collapse: collapse; width: 100%; max-width: 600px;">
            <thead>
             <tr>
                <th>Q.ta</th>
                <th>Descrizione</th>
                <th>Costo Unitario</th>
                <th>Totale</th>
             </tr>
            </thead> 
            <tbody>
             <tr>
                <td><input type="number" id="Q1" value="0" min="0"></td>
                <td>mouse</td>
                <td>16$</td>
                <td id="tot1">0</td>
             </tr>
             <tr>
                <td><input type="number" id="Q2" value="0" min="0"></td>
                <td>tastiera 105 tasti</td>
                <td>25$</td>
                <td id="tot2">0</td>
             </tr>
             <tr>
                <td><input type="number" id="Q3" value="0" min="0"></td>
                <td>stampante deskjet colori</td>
                <td>350$</td>
                <td id="tot3">0</td>
             </tr>
             <tr>
                <td><input type="number" id="Q4" value="0" min="0"></td>
                <td>scanner A4 colori</td>
                <td>200$</td>
                <td id="tot4">0</td>
             </tr>
             <tr>
                <td></td>
                <td></td>
                <td><button onclick="Totale()" class="btn-small">TOTALE ORDINI -></button></td>
                <td id="totFin"><strong>0</strong></td>
             </tr>
            </tbody>
        </table>

        <br>
        <div class="form-ordine">
            <label>Desidero ricevere notifiche </label>
            <input type="radio" id="radio1" name="ciao"><label for="radio1">Si</label>
            <input type="radio" id="radio2" name="ciao" checked><label for="radio2">No</label>
            <br><br>

            <label for="txtEmail">E-mail: </label>
            <input type="email" id="txtEmail">
            <br><br>

            <label for="combo1">Pagamento: </label>
            <select id="combo1"></select>
            <br><br>

            <button onclick="inviaOrdine()" id="buttonFinale" class="btn">INVIA ORDINE</button>
        </div>
    </section>
