<!DOCTYPE html>
<html lang="it">
    <head> 
        <meta charset="UTF-8">
        <title>Esempio di funzione JavaScript - Marco Ballabio</title>
        <link rel="stylesheet" href="../../style.css">
        <link rel="stylesheet" href="https://Sballabiaz.github.io/style.css">
        
        <script>
            
            function saluta() {
                console.log("Hai cliccato il bottone!");
            }

            window.onload = function(){
                let bottone = document.getElementById("cliccaBottone");
                bottone.addEventListener("click", saluta); 
            }
            

            // Questa funzione verrà chiamata quando l'utente clicca il bottone
            function cambiaTesto() {
                document.getElementById("demo").innerHTML = "Hello JavaScript!";
            }
        </script>
    </head>

    <body>

        <nav id="nav-principale">
            <ul>
                <li><a href="../../index.html" class="nav-link">Home</a></li>
                <li><a href="../../index.html#about" class="nav-link">Chi sono</a></li>
                <li><a href="../../index.html#competenze" class="nav-link">Competenze</a></li>
                <li><a href="../../index.html#progetti" class="nav-link">Progetti</a></li>
                <li><a href="../../index.html#contatti" class="nav-link">Contatti</a></li>
            </ul>
        </nav>

        <section class="sezione">
            <h2>What Can JavaScript Do?</h2>

            <p id="demo">JavaScript can change HTML content.</p>

            <button type="button" onclick="cambiaTesto()" class="btn-small">Click Me!</button>

            <button type="button" id="cliccaBottone" class="btn-small">Clicca qui!</button>
        </section>

        <footer class="footer-principale">
            <p>© 2026 Marco Ballabio — <a href="../../index.html" style="color: white; text-decoration: underline;">Torna alla Home</a></p>
            <ul>
                <li><a href="https://github.com/Sballabiaz" class="footer-link">GitHub</a></li>
                <li><a href="#" class="footer-link">LinkedIn</a></li>
            </ul>
        </footer>

    </body>
</html>
