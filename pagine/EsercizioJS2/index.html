<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Cambiare immagine con JS - Marco Ballabio</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="https://Sballabiaz.github.io/style.css">

    <script>
        // Funzione che accende la "lampadina"
        function accendiLuce() {
            document.getElementById("myImage").src = "images/lampadinaaccesa.jpg";
        }

        // Funzione che spegne la "lampadina"
        function spegniLuce() {
            document.getElementById("myImage").src = "images/lampadinaspenta.jpg";
        }
    </script>
</head>

<body>

    <nav id="nav-principal">
        <ul>
            <li><a href="../../index.html" class="nav-link">Home</a></li>
            <li><a href="../../index.html#about" class="nav-link">Chi sono</a></li>
            <li><a href="../../index.html#competenze" class="nav-link">Competenze</a></li>
            <li><a href="../../index.html#progetti" class="nav-link">Progetti</a></li>
            <li><a href="../../index.html#contatti" class="nav-link">Contatti</a></li>
        </ul>
    </nav>

    <section class="sezione">
        <h2>What Can JavaScript Do?</h2>

        <p>JavaScript can change HTML attribute values.</p>

        <p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

        <div style="text-align: center; margin-top: 20px;">
            <button type="button" onclick="accendiLuce()" class="btn-small">Turn on the light</button>

            <img id="myImage" src="images/lampadinaspenta.jpg" style="width:100px; vertical-align: middle; margin: 0 20px;">

            <button type="button" onclick="spegniLuce()" class="btn-small">Turn off the light</button>
        </div>
    </section>

    <footer class="footer-principale">
        <p>© 2026 Marco Ballabio — <a href="../../index.html" style="color: white; text-decoration: underline;">Torna alla Home</a></p>

            <li><a href="https://github.com/Sballabiaz" class="footer-link">GitHub</a></li>
            <li><a href="#" class="footer-link">LinkedIn</a></li>
        </ul>
    </footer>

</body>
</html>
